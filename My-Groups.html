<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitMate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body>
    <section id="my-groups">
        <header class=" flex items-center justify-between border-b border-gray-200 bg-white px-9 py-5 ">
            <div class="flex flex-col gap-1">
                <p class="text-xs text-gray-400">
                    SplitMate /
                </p>
                <h1 class="text-lg font-medium text-slate-800">
                    My Groups
                </h1>
            </div>
            <button id="create-group"
                class="flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-lg hover:bg-indigo-700">
                <span class="text-xl leading-none">+</span>Create group</button>
        </header>


        <div class="px-9 py-7 bg-gray-50">
            <div>
                <h1 class="text-2xl font-medium text-slate-800">
                    My Groups
                </h1>
                <p class="mt-2 text-sm text-slate-500">
                    Organize expenses with the people you share life with.
                </p>
            </div>
            <div
                class="mt-8 flex flex-wrap items-center justify-between gap-4 rounded-xl border border-slate-200 bg-white p-3">
                <div class="flex w-full min-w-0 flex-wrap items-center gap-3 lg:w-auto">
                    <div
                        class="flex w-full min-w-0 items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 md:w-80">
                        <i class="ri-search-2-line shrink-0 text-slate-400"></i>
                        <input type="search" placeholder="Search groups..."
                            class="w-full min-w-0 bg-transparent text-sm outline-none placeholder:text-slate-400">
                    </div>
                    <div class="flex max-w-full items-center rounded-lg bg-slate-100 p-1">
                        <button class="rounded-md bg-white px-4 py-2 text-xs font-medium text-slate-700 shadow-sm">
                            All</button>
                        <button class="rounded-md px-4 py-2 text-xs text-slate-500"> Active</button>
                        <button class="rounded-md px-4 py-2 text-xs text-slate-500">Closed</button>
                    </div>

                </div>
                <div>
                    <select
                        class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs text-slate-600 outline-none">
                        <option>Recently Added</option>
                        <option>Oldest</option>
                        <option>A-Z</option>
                    </select>
                </div>
            </div>
        </div>

        </div>
        <section class="px-4 py-6 sm:px-9 bg-gray-50">
            <div class="mb-3 flex items-center justify-between">
                <p class="text-xs text-slate-400" id="groups-counter"></p>
                <p id="empty-message" class="text-slate-500 hidden">
                    No tasks yet. Add one above.
                </p>
                <p class="text-xs text-slate-400">Updated just now</p>
            </div>
            <div id="groups-container" class="flex flex-wrap gap-4">




            </div>
        </section>
        </article>
        <div id="group-form-contenaire"
            class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 hidden">
            <section class="w-full max-w-[520px] overflow-hidden rounded-2xl bg-white shadow-2xl ">
                <div class="flex items-start justify-between border-b border-gray-200 px-6 py-5">
                    <div>
                        <h5 class="text-lg font-medium text-slate-800">
                            Create new group
                        </h5>
                        <small class="mt-1 block text-xs text-slate-500">
                            Create a space to track expenses together.
                        </small>
                    </div>
                    <button type="button" id="close-groupe-form"
                        class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200">
                        <i class="ri-close-line text-xl"></i>
                    </button>
                </div>
                <form id="create-group-form" class="flex flex-col">
                    <div class="flex flex-col gap-4 px-6 py-5">
                        <div class="flex flex-col gap-2">
                            <label for="group-name" class="text-xs font-medium text-slate-700">
                                Group name <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="group-name" name="nom" placeholder="e.g. Weekend Marrakech"
                                class="w-full rounded-lg border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none placeholder:text-slate-400 focus:border-indigo-500">
                            <small id="name-error" class="text-xs text-red-400"></small>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label for="group-description" class="text-xs font-medium text-slate-700">
                                Description
                            </label>
                            <textarea id="group-description" name="description" rows="3"
                                placeholder="What is this group for?"
                                class="w-full resize-y rounded-lg border border-slate-200 px-3 py-3 text-sm text-slate-800 outline-none placeholder:text-slate-400 focus:border-indigo-500"></textarea>
                            <small id="description-error" class="text-xs text-slate-400">
                                Keep it short and helpful.
                            </small>
                        </div>
                        <div class="flex flex-col gap-4 sm:flex-row">
                            <div class="flex min-w-0 flex-1 flex-col gap-2">
                                <label for="group-currency" class="text-xs font-medium text-slate-700">
                                    Currency <span class="text-red-500">*</span>
                                </label>
                                <select id="group-currency" name="devise"
                                    class="w-full rounded-lg border border-slate-200 bg-white px-3 py-3 text-sm text-slate-800 outline-none focus:border-indigo-500">
                                    <option value="MAD">MAD — Moroccan Dirham</option>
                                    <option value="EUR">EUR — Euro</option>
                                    <option value="USD">USD — US Dollar</option>
                                </select>
                                <small id="currency-error" class="text-xs text-slate-400">
                                    Choose the currency
                                </small>
                            </div>
                            <div class="flex min-w-0 flex-1 flex-col gap-2">
                                <label for="group-date" class="text-xs font-medium text-slate-700">
                                    Start date <span class="text-red-500">*</span>
                                </label>
                                <input type="date" id="group-date" name="dateDebut"
                                    class="w-full min-w-0 rounded-lg border border-slate-200 bg-white px-3 py-3 text-sm text-slate-800 outline-none focus:border-indigo-500">
                                <small id="date-error" class="text-xs text-red-400"></small>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-end gap-3 border-t border-slate-200 px-6 py-5">
                        <button type="button" id="cancel"
                            class="rounded-lg border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50">
                            Cancel
                        </button>
                        <button type="submit"
                            class="flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-3 text-sm font-medium text-white shadow-md hover:bg-indigo-700">
                            <i class="ri-check-line text-lg"></i>
                            Create group
                        </button>

                    </div>
                </form>
            </section>
        </div>
    </section>

<script src="./js/utils.js"></script>
