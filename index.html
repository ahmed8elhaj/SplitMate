<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>slipt Mate</title>
  </head>

  <body class="flex">
    <aside id="aside" class="aside-size">
      <span class="logo">
        <i class="fa-solid fa-people-carry-box iconColor"></i>
        <strong>Splite Mate</strong>
      </span>
      <p>Workspace</p>
      <nav class="flex-column">
        <button id="btn-Dashboard">Dashboard</button>
        <button id="btn-Mygroups">My Groups</button>
        <button id="btn-ALLexpenses">All Expenses</button>
        <button id="btn-Ballances">Balances</button>
      </nav>
    </aside>

    <main>
      <header id="top-header">
        <div>
          <p>SplitMate /</p>
          <h1>Dashboard</h1>
        </div>
        <button id="btn-addGroup">
          <i class="fa-solid fa-plus"></i>
          Add group
        </button>
      </header>

      <section id="hero">
        <h2>groups</h2>
        <div>
          <i class="fa-solid fa-users"></i>
          <p>Total groups</p>
          <strong>3</strong>
          <p>2 active</p>
        </div>
        <div>
          <i class="fa-solid fa-users"></i>
          <p>Total groups</p>
          <strong>3</strong>
          <p>2 active</p>
        </div>
        <div>
          <i class="fa-solid fa-users"></i>
          <p>Total groups</p>
          <strong>3</strong>
          <p>2 active</p>
        </div>
        <div>
          <i class="fa-solid fa-users"></i>
          <p>Total groups</p>
          <strong>3</strong>
          <p>2 active</p>
        </div>
      </section>

      <section id="Recent-expenses">
        <div>
          <div>
            <strong>Recent expenses</strong>
            <p>Your latest shared activity</p>
          </div>
          <button>View all <i class="fa-solid fa-greater-than"></i></button>
        </div>
      </section>
    </main>
  </body>
</html>
